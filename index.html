<style>

cent);border:1px solid var(--line)}.completed-entry{position:relative;background:#dcfce7!important;color:#166534!important}.completed-entry::after{content:"★";position:absolute;top:5px;left:7px;color:#d97706;font-size:22px;line-height:1}
.rates-table td.derived-rate[contenteditable="true"]{background:var(--soft)}
.incoming-week{margin:0 0 12px;padding:10px 12px;border-radius:11px;background:var(--soft);font-weight:800;text-align:center}.incoming-day{border:1px solid var(--line);border-radius:12px;background:var(--cell);overflow:hidden;margin-bottom:9px}.incoming-day summary{cursor:pointer;padding:12px 14px;font-weight:800;display:flex;align-items:center;justify-content:space-between;list-style:none}.incoming-day summary::-webkit-details-marker{display:none}.incoming-day summary:after{content:'⌄';color:var(--accent);font-size:18px}.incoming-day[open] summary{background:var(--soft);color:var(--accent)}.incoming-body{padding:10px 12px;border-top:1px solid var(--line)}.incoming-row,.incoming-head,.incoming-total{display:grid;grid-template-columns:minmax(0,1fr) 84px 84px 34px;gap:6px;align-items:center;margin-bottom:6px}.incoming-head{color:var(--muted);font-size:12px;font-weight:700;text-align:center}.incoming-row input{width:100%;min-width:0;padding:9px 8px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font:inherit;font-size:15px;outline:0}.incoming-row input.inc-num{text-align:center;direction:ltr}.incoming-row input:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}.incoming-row .inc-del{padding:0;height:34px;width:34px;background:transparent;color:#b91c1c;border:1px solid var(--line);font-size:18px}.incoming-total{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-weight:900;color:var(--accent2)}.incoming-total b{text-align:center}.incoming-add{margin-top:6px}
body.panel-hidden .layout{grid-template-columns:1fr}body.panel-hidden .control-panel{display:none}body.panel-hidden .panel-toggle{position:fixed;right:0;top:50%;transform:translateY(-50%);border-radius:11px 0 0 11px;z-index:10}

<body>
<div class="app">
  <div class="paper">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">▤</div><div><h1>جدول توزيع العمالة</h1><p class="subtitle">لوحة يومية بواجهة هادئة مثل القارئ الإلكتروني</p></div></div>
      <div class="date-box"><span class="date-label">تاريخ اليوم</span><span class="today" id="today"></span></div><div class="font-control"><button class="font-button" onclick="toggleFontMenu()" title="التحكم في حجم الخط">A</button><div class="font-menu" id="fontMenu"><span class="font-menu-title">حجم خط الجدول</span><div class="font-actions"><button onclick="changeFontSize(-1)">−</button><span class="font-value" id="fontValue">19</span><button onclick="changeFontSize(1)">+</button></div></div></div>
    </header>
    <main class="layout">
      <section class="workspace">
        <div class="shift-switch" role="group" aria-label="اختيار الوردية"><button id="shiftButtonA" type="button" onclick="switchShift('A')" aria-pressed="false">وردية أ</button><button id="shiftButtonB" type="button" onclick="switchShift('B')" aria-pressed="false">وردية ب</button></div>
        <div class="admin-bar"><span class="admin-status" id="adminStatus">جارٍ التحميل…</span><button id="adminLoginButton" type="button" onclick="openShiftLogin()">إعداد كلمة مرور الوردية</button><button id="adminLogoutButton" class="secondary" type="button" onclick="logoutShiftAdmin()" hidden>تسجيل الخروج</button></div>
        <div class="section-title"><h2>بيانات اليوم</h2><span class="hint" id="shiftHint">اكتب مباشرة داخل الخانات</span></div>
        <div class="table-wrap"><table id="workTable"><tbody></tbody></table></div>
        <div class="actions"><button class="ghost" onclick="pinMainTable()" title="يحفظ الأسماء الحالية لتظهر تلقائيًا في بداية كل يوم">تثبيت القائمة الرئيسية</button><button class="secondary" onclick="clearTable()">مسح الجدول</button><span class="status" id="status"></span></div>
      </section>
      <aside class="control-panel" id="controlPanel">
        <div class="panel-heading"><h3>لوحة التحكم</h3><span>☰</span></div>
        <div class="nav-grid">
          <button class="nav-btn" onclick="openStaff('backup')"><span class="nav-icon">◈</span>العمال الاحتياطي</button><button class="nav-btn" onclick="openPermits()"><span class="nav-icon">⌑</span>تصاريح</button>
          <button class="nav-btn" onclick="openStaff('leave')"><span class="nav-icon">◌</span>الإجازات اليوم</button>
          <button class="nav-btn" onclick="openAnnualLeave()"><span class="nav-icon">▣</span>الإجازة السنوية</button>
          <button class="nav-btn" onclick="openArchive()"><span class="nav-icon">▦</span>الأرشيف</button>
          <button class="nav-btn" onclick="openRates()"><span class="nav-icon">⌁</span>معدلات</button>
          <button class="nav-btn" onclick="openIncoming()"><span class="nav-icon">⇩</span>جدول الوارد</button>
          <button class="nav-btn" onclick="openThemes()"><span class="nav-icon">◐</span>السيمات</button>
          <button class="nav-btn" onclick="exportBackup()"><span class="nav-icon">⬇</span>تصدير نسخة</button><button class="nav-btn" id="backupImportButton" onclick="document.querySelector('#backupFileInput').click()"><span class="nav-icon">⬆</span>استيراد نسخة</button>
        </div>
      </aside>
    </main>
  </div>
  <button class="panel-toggle" id="togglePanel" type="button" onclick="togglePanel(event)" title="إظهار أو إخفاء لوحة التحكم" aria-label="إظهار أو إخفاء لوحة التحكم">☰</button>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="backdropClose(event)"><div class="modal" id="modal"></div></div><input type="file" id="backupFileInput" accept="application/json,.json" hidden onchange="importBackup(event)">
<script src="config.js"></script>
<script>
// النسخة المحلية: لا تستخدم Supabase ولا ترسل بيانات خارج هذا الهاتف.
const SHIFT_DATA_KEYS=new Set(['labor_distribution_table_v2','labor_pinned_table','labor_base_table','labor_base_locked_v2','labor_app_day','labor_backup','labor_pinned_backup','labor_leave','labor_archive','labor_completed_cells','labor_annual_leave','labor_permits','labor_rates','labor_incoming']);
const activeShift=localStorage.getItem('labor_active_shift')==='B'?'B':'A';
const localKeyFor=key=>activeShift==='B'&&SHIFT_DATA_KEYS.has(key)?`labor_shift_b_${key}`:key;
// ===== الحفظ المشترك على Supabase =====
// الزوار: عرض فقط من السحابة. المشرف: يسجّل الدخول (بريد + كلمة مرور) فتُحفظ تغييراته للجميع.
// إن لم يوجد config.js صحيح يعمل التطبيق محليًا على الهاتف كما كان.
const CFG=window.SHIFT_CONFIG||{};
const SB_URL=String(CFG.supabaseUrl||'').replace(/\/+$/,''),SB_KEY=String(CFG.supabasePublishableKey||'');
const SYNC_ENABLED=!!(SB_URL&&SB_KEY);
const MAIN_KEYS=[...SHIFT_DATA_KEYS].filter(k=>k!=='labor_archive');

async function getToken(){
  if(!auth)throw Object.assign(Error('no-auth'),{auth:true});
  if(auth.expires_at-Date.now()>60000)return auth.access_token;
  if(!refreshPromise)refreshPromise=(async()=>{
    const r=await sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:auth.refresh_token})});
    if(!r.ok){const definitive=[400,401,403].includes(r.status);if(definitive)dropAuth();throw Object.assign(Error('refresh-'+r.status),{auth:definitive})}

  })().finally(()=>{refreshPromise=null});

async function fetchMain(full,timeout=15000){
  const r=await sbFetch(`/rest/v1/shift_state?shift=eq.${activeShift}&select=${full?'revision,data':'revision'}`,{timeout});
  if(!r.ok){const e=Error('fetch-main-'+r.status);e.status=r.status;throw e}
  return (await r.json())[0]||null;
}
function applyMain(row){
  MAIN_KEYS.forEach(k=>{const v=row.data&&row.data[k],lk=localKeyFor(k);if(typeof v==='string')localStorage.setItem(lk,v);else localStorage.removeItem(lk)});
  localStorage.setItem(syncKey('base'),String(row.revision));
  localStorage.removeItem(syncKey('dm'));
}
async function pullArchive(){
  const admin=SYNC_ENABLED&&isShiftAdmin();
  let since=Number(localStorage.getItem(syncKey('arch'))||0);
  for(;;){
    const r=await sbFetch(`/rest/v1/shift_archive?shift=eq.${activeShift}&seq=gt.${since}&select=day,data,seq&order=seq.asc&limit=200`);
    if(!r.ok)throw Error('fetch-archive-'+r.status);
    const rows=await r.json();
    if(!rows.length)break;
    const arch=readArchive(),map=admin?readAhash():null;
    rows.forEach(row=>{
      since=Math.max(since,row.seq);
      const local=arch[row.day];
      if(admin&&local&&map[row.day]!==stampOf(local))return; // تعديل محلي لم يُرفع بعد: لا نستبدله
      arch[row.day]=row.data;
      if(admin)map[row.day]=stampOf(row.data);
    });
    localStorage.setItem(localKeyFor(ARCHIVE_STORE_KEY),JSON.stringify(arch));
    if(admin)writeAhash(map);
    localStorage.setItem(syncKey('arch'),String(since));
    if(rows.length<200)break;
  }
}
// ---- الرفع إلى السحابة (للمشرف فقط) ----
async function pushMain(token){
  const base=getBase()??0;
  const r=await sbFetch(`/rest/v1/shift_state?shift=eq.${activeShift}&revision=eq.${base}`,{method:'PATCH',token,headers:{Prefer:'return=representation'},body:JSON.stringify({data:collectMain()})});
  if(r.status===401||r.status===403){dropAuth();throw Object.assign(Error('auth-'+r.status),{auth:true})}
  if(!r.ok)throw Error('push-main-'+r.status);
  const rows=await r.json();
  if(!rows.length)return false;
  localStorage.setItem(syncKey('base'),String(rows[0].revision));
  return true;
}
async function pushArchive(token){
  const arch=readArchive(),map=readAhash();
  const days=Object.keys(arch).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&map[d]!==stampOf(arch[d]));
  for(let i=0;i<days.length;i+=100){
    const chunk=days.slice(i,i+100);
    const r=await sbFetch('/rest/v1/shift_archive?on_conflict=shift,day',{method:'POST',token,headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(chunk.map(day=>({shift:activeShift,day,data:arch[day]||{}})))});

    if(!r.ok)throw Error('push-archive-'+r.status);
    chunk.forEach(day=>{map[day]=stampOf(arch[day])});
    writeAhash(map);
  }
}
async function resolveConflict(){
  const row=await fetchMain(true);
  if(!row){setSyncNote('⚠ جدول Supabase غير مُعدّ');return}
  if(row.revision===(getBase()??0)){dropAuth();updateAdminUi();setStatus('هذا الحساب غير مخوّل لتعديل هذه الوردية.');return}
  stashLocal();applyMain(row);
  try{await pullArchive()}catch{}
  try{sessionStorage.setItem('labor_notice','تم تحميل نسخة أحدث حفظها جهاز آخر.')}catch{}
  reloadPage();
}
async function doPush(){
  if(!isDirty())return true;
  const version=localMutationVersion;
  try{
    const token=await getToken();
    if(isDirtyMain()){
      if(!getBase()&&!localHasData())localStorage.removeItem(syncKey('dm')); // لا نرفع جدولًا فارغًا فوق سحابة فارغة
      else if(!await pushMain(token)){await resolveConflict();return false}
    }
    if(isDirtyArch())await pushArchive(token);
    if(version===localMutationVersion){localStorage.removeItem(syncKey('dm'));localStorage.removeItem(syncKey('da'))}
    else scheduleRemoteSave(300);
    setSyncNote('☁ تم الحفظ '+timeLabel());
    return true;
  }catch(e){
    if(e&&e.auth){updateAdminUi();setStatus('انتهت جلسة المشرف. سجّل الدخول من جديد قبل التعديل.');return false}
    console.warn('sync push failed',e);
    scheduleRemoteSave(30000);
    setSyncNote('⚠ تعذر الحفظ على السحابة — ستُعاد المحاولة تلقائيًا');
    return false;
  }
}
function scheduleRemoteSave(delay=1200){
  if(!SYNC_ENABLED||!isShiftAdmin())return;

  if(!syncNote.startsWith('⚠'))setSyncNote('☁ بانتظار الحفظ…');

function flushSharedState(){
  if(!SYNC_ENABLED||!isShiftAdmin()||!isDirty())return Promise.resolve(true);

async function syncOnStart(){

    setSyncNote(e&&e.status===404?'⚠ جدول Supabase غير موجود — شغّل ملف SQL':'⚠ لا يوجد اتصال بالسحابة — تُعرض آخر بيانات محفوظة');
    return;
  }
  if(!row){setSyncNote('⚠ صف هذه الوردية غير موجود في Supabase — شغّل ملف SQL');return}
  remoteReady=true;
  const admin=isShiftAdmin(),base=getBase(),hasLocal=localHasData();
  let skipArchive=false;
  if(row.revision===0){
    // السحابة فارغة: بيانات هذا الهاتف هي الأصل، يرفعها المشرف أول مرة
    if(admin&&hasLocal){localStorage.setItem(syncKey('base'),'0');localStorage.setItem(syncKey('dm'),'1');localStorage.setItem(syncKey('da'),'1')}
  }else if(!admin){
    if(base!==row.revision)applyMain(row);
  }else if(base===null&&hasLocal){
    const usePhone=confirm('توجد بيانات محفوظة على السحابة وبيانات أخرى على هذا الهاتف.\n\nموافق = اعتماد بيانات هذا الهاتف ورفعها إلى السحابة (تحلّ محل جدول السحابة الحالي).\nإلغاء = تحميل بيانات السحابة بدل بيانات هذا الهاتف.');
    if(usePhone){
      localStorage.setItem(syncKey('base'),String(row.revision));localStorage.setItem(syncKey('dm'),'1');localStorage.setItem(syncKey('da'),'1');
      skipArchive=true;
    }else{
      stashLocal();applyMain(row);
      localStorage.removeItem(syncKey('arch'));localStorage.removeItem(syncKey('ah'));localStorage.removeItem(localKeyFor(ARCHIVE_STORE_KEY));
    }
  }else if(!isDirtyMain()){
    if(base!==row.revision)applyMain(row);
  }else if(base!==row.revision){
    // تعديلات غير مرفوعة على هذا الجهاز لكن جهازًا آخر حفظ بعدها: نعتمد السحابة ونحتفظ بنسخة احتياطية
    stashLocal();applyMain(row);
    try{sessionStorage.setItem('labor_notice','تم تحميل نسخة أحدث حفظها جهاز آخر.')}catch{}
  }
  if(admin&&!skipArchive){try{await pullArchive()}catch(e){console.warn('archive pull failed',e)}}
  setSyncNote(admin?'☁ متصل':'آخر تحديث '+timeLabel());
}

function getDateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatDate(d=new Date()){return d.toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
function distinguishHisham(data=[]){let found=0;return data.map(row=>row.map((cell,c)=>{const value=String(cell||'').trim();if(c>0&&value==='هشام'){found++;return found===2?'هشام ب':value}return cell}))}
function distinguishHassan(data=[]){let found=0,marked=false;const rows=data.map(row=>row.map((cell,c)=>{const value=String(cell||'').trim();if(c>0&&value==='حسن'&&String(row[0]||'').includes('رشم')){marked=true;return 'حسن ط'}return cell}));return rows.map(row=>row.map((cell,c)=>{if(c>0&&String(cell||'').trim()==='حسن'){found++;return !marked&&found===2?'حسن ط':cell}return cell}))}
function ensureHishamDistinction(){const base=JSON.parse(appStorage.getItem(BASE_TABLE_KEY)||'[]');const fixedBase=distinguishHassan(distinguishHisham(base));if(JSON.stringify(base)!==JSON.stringify(fixedBase))appStorage.setItem(BASE_TABLE_KEY,JSON.stringify(fixedBase));const current=JSON.parse(appStorage.getItem(PINNED_TABLE_KEY)||appStorage.getItem(TABLE_KEY)||'[]');const fixedCurrent=distinguishHassan(distinguishHisham(current));if(JSON.stringify(current)!==JSON.stringify(fixedCurrent)){appStorage.setItem(PINNED_TABLE_KEY,JSON.stringify(fixedCurrent));appStorage.setItem(TABLE_KEY,JSON.stringify(fixedCurrent));}}
function withBlowSection(data=[]){
  const rows=Array.isArray(data)?data.map(row=>Array.isArray(row)?row.slice(0,COLS):[]):[];
  const blowIndex=rows.findIndex(row=>String(row[0]||'').trim()==='بلوف');
  if(blowIndex===-1){
    const farzIndex=rows.findIndex(row=>String(row[0]||'').trim()==='فرز');
    const blowRow=['بلوف',...Array(COLS-1).fill('')];
    rows.splice(farzIndex===-1?rows.length:farzIndex+1,0,blowRow);
  }else{
    rows[blowIndex][0]='بلوف';
    for(let c=1;c<COLS;c++)rows[blowIndex][c]=rows[blowIndex][c]||'';
  }
  while(rows.length<ROWS)rows.push([]);
  return rows.slice(0,ROWS);
}
function ensureBlowSectionInStorage(){
  [BASE_TABLE_KEY,PINNED_TABLE_KEY,TABLE_KEY].forEach(key=>{
    const raw=appStorage.getItem(key);
    if(raw)appStorage.setItem(key,JSON.stringify(withBlowSection(JSON.parse(raw))));
  });
}
function removeNamesFromRoster(names){
  const target=new Set(names.map(name=>String(name||'').trim()).filter(Boolean));
  if(!target.size)return;
  const removeFrom=(data,keepBlow=true)=>withBlowSection(data).map(row=>{
    const isBlow=String(row[0]||'').trim()==='بلوف';
    if(keepBlow&&isBlow)return row;
    return row.map((cell,c)=>c>0&&target.has(String(cell||'').trim())?'':cell);
  });
  // القائمة الأساسية (BASE) لا تُعدَّل هنا أبدًا؛ تتغير فقط بزر «تثبيت القائمة الرئيسية».
  const current=readTable();
  const cleaned=removeFrom(current);
  if(JSON.stringify(current)!==JSON.stringify(cleaned)){
    writeTable(cleaned);
    appStorage.setItem(PINNED_TABLE_KEY,JSON.stringify(cleaned));
    appStorage.setItem(TABLE_KEY,JSON.stringify(cleaned));
  }
  const backup=readEntries(BACKUP_KEY,10).map(name=>target.has(String(name).trim())?'':name);
  const pinnedBackup=readEntries(PINNED_BACKUP_KEY,10).map(name=>target.has(String(name).trim())?'':name);
  appStorage.setItem(BACKUP_KEY,JSON.stringify(backup));
  appStorage.setItem(PINNED_BACKUP_KEY,JSON.stringify(pinnedBackup));
}
function handleTableInput(){
  const data=readTable();
  const blowNames=[];
  data.forEach(row=>{if(String(row[0]||'').trim()==='بلوف')row.slice(1).forEach(name=>{if(String(name||'').trim())blowNames.push(String(name).trim())})});
  if(blowNames.length)removeNamesFromRoster([...new Set(blowNames)]);
  syncBackupNamesFromMain(readTable());
}

function prepareDay(){
  // تثبيت حالة اللوحة الحالية مرة واحدة فقط كلوحة أساسية
  if(!appStorage.getItem(BASE_LOCK_KEY)){
    const current=JSON.parse(appStorage.getItem(PINNED_TABLE_KEY)||appStorage.getItem(TABLE_KEY)||'[]');
    if(current.length)appStorage.setItem(BASE_TABLE_KEY,JSON.stringify(current));
    appStorage.setItem(BASE_LOCK_KEY,'1');
  }
  const existingBase=appStorage.getItem(BASE_TABLE_KEY);
  if(!existingBase){
    const initial=JSON.parse(appStorage.getItem(PINNED_TABLE_KEY)||appStorage.getItem(TABLE_KEY)||'[]');
    appStorage.setItem(BASE_TABLE_KEY,JSON.stringify(initial));
  }
  ensureHishamDistinction();
  ensureBlowSectionInStorage();
  const today=getDateKey();
  if(appStorage.getItem(APP_DAY_KEY)!==today){
    const base=JSON.parse(appStorage.getItem(BASE_TABLE_KEY)||'[]');
    appStorage.setItem(PINNED_TABLE_KEY,JSON.stringify(base));
    appStorage.setItem(TABLE_KEY,JSON.stringify(base));
    // يبدأ كل يوم جديد ببيانات معدلات وإجازات فارغة، مع الاحتفاظ بأرشيف الأيام السابقة
    appStorage.setItem('labor_rates','[]');
    appStorage.setItem(LEAVE_KEY,JSON.stringify(Array(15).fill('')));appStorage.setItem(PERMITS_KEY,JSON.stringify(emptyPermits(15)));
    // لا نسمح بظهور نسخة قديمة لبيانات اليوم الجديد داخل الأرشيف
    const archive=JSON.parse(appStorage.getItem(ARCHIVE_KEY)||'{}');
    delete archive[today];
    appStorage.setItem(ARCHIVE_KEY,JSON.stringify(archive));
    appStorage.setItem(APP_DAY_KEY,today);
    appStorage.removeItem(COMPLETED_KEY);
  }
}
let autoSaveTimer;
function scheduleAutoSave(){clearTimeout(autoSaveTimer);autoSaveTimer=setTimeout(()=>saveToday(true),900)}
function syncBackupNamesFromMain(data=[]){
  const mainNames=new Set(data.flat().map(name=>String(name||'').trim()).filter(Boolean));
  if(!mainNames.size)return;
  const current=readEntries(BACKUP_KEY,10), pinned=readEntries(PINNED_BACKUP_KEY,10);
  const filteredCurrent=current.map(name=>mainNames.has(String(name).trim())?'':name);
  const filteredPinned=pinned.map(name=>mainNames.has(String(name).trim())?'':name);
  if(JSON.stringify(current)!==JSON.stringify(filteredCurrent))appStorage.setItem(BACKUP_KEY,JSON.stringify(filteredCurrent));
  if(JSON.stringify(pinned)!==JSON.stringify(filteredPinned))appStorage.setItem(PINNED_BACKUP_KEY,JSON.stringify(filteredPinned));
}
function saveToday(silent=false,internal=false){
  if(!internal&&!requireShiftAdmin())return false;
  const data=readTable();
  syncBackupNamesFromMain(data);
  const previous=JSON.parse(appStorage.getItem(PINNED_TABLE_KEY)||appStorage.getItem(TABLE_KEY)||'[]');
  appStorage.setItem(PINNED_TABLE_KEY,JSON.stringify(data));
  appStorage.setItem(TABLE_KEY,JSON.stringify(data));
  syncAnnualLeaves();
  const archive=JSON.parse(appStorage.getItem(ARCHIVE_KEY)||'{}');
  archive[currentDateKey]={table:data,backup:readEntries(BACKUP_KEY,10),leave:readEntries(LEAVE_KEY,15),rates:JSON.parse(appStorage.getItem('labor_rates')||'[]'),annual:JSON.parse(appStorage.getItem(ANNUAL_LEAVE_KEY)||'{}'),permits:readPermits(),updatedAt:new Date().toISOString()};

}
function clearTable(){if(!requireShiftAdmin())return;if(confirm('هل تريد مسح بيانات جدول اليوم؟ ستبقى القائمة الأساسية المثبتة للأيام القادمة.')){writeTable();tbody.querySelectorAll('.completed-cell').forEach(td=>{td.classList.remove('completed-cell');td.title=''});saveCompletedCells();appStorage.removeItem(TABLE_KEY);appStorage.removeItem(PINNED_TABLE_KEY);saveToday(true);setStatus('تم مسح جدول اليوم؛ ستبقى القائمة المثبتة للأيام القادمة.')}}
function pinMainTable(){
  if(!requireShiftAdmin())return;
  clearTimeout(autoSaveTimer);
  const currentData=readTable();
  const normalizedData=distinguishHassan(distinguishHisham(currentData));
  const fixedData=withBlowSection(normalizedData).map(row=>String(row[0]||'').trim()==='بلوف'?[row[0],...Array(COLS-1).fill('')]:row);
  const serializedCurrent=JSON.stringify(currentData);
  const serializedBase=JSON.stringify(fixedData);
  try{
    // احفظ نسخة اليوم أولًا كي تبقى ظاهرة بعد إعادة التحميل حتى لو تعذر تحديث الأرشيف.
    appStorage.setItem(PINNED_TABLE_KEY,serializedCurrent);
    if(appStorage.getItem(PINNED_TABLE_KEY)!==serializedCurrent)throw new Error('تعذر التحقق من حفظ جدول اليوم.');
    appStorage.setItem(TABLE_KEY,serializedCurrent);
    if(appStorage.getItem(TABLE_KEY)!==serializedCurrent)throw new Error('تعذر التحقق من نسخة جدول اليوم.');
    // احفظ القائمة الأساسية التي ستُستعاد عند بدء يوم جديد.
    appStorage.setItem(BASE_TABLE_KEY,serializedBase);
    if(appStorage.getItem(BASE_TABLE_KEY)!==serializedBase)throw new Error('تعذر التحقق من القائمة الأساسية بعد الحفظ.');
    appStorage.setItem(BASE_LOCK_KEY,'1');
    if(appStorage.getItem(BASE_LOCK_KEY)!=='1')throw new Error('تعذر تثبيت علامة حفظ القائمة الأساسية.');
  }catch(error){
    setStatus('تعذر تثبيت القائمة الرئيسية في تخزين المتصفح. لم يتم تأكيد الحفظ؛ تحقق من إعدادات/مساحة التخزين.');
    clearTimeout(window.statusTimer);
    window.statusTimer=setTimeout(()=>{const status=document.querySelector('#status');if(status)status.textContent=''},10000);
    console.error('pinMainTable failed:',error);
    return;
  }
  const warnings=[];
  try{
    // الأرشيف مكمل اختياري؛ تعذره لا يلغي تثبيت القائمة الرئيسية.
    saveToday(true);
  }catch(error){
    warnings.push('تعذر تحديث أرشيف اليوم');
    console.error('pinMainTable archive update failed:',error);
  }
  try{
    const serializedBackup=JSON.stringify(readEntries(BACKUP_KEY,10));
    appStorage.setItem(PINNED_BACKUP_KEY,serializedBackup);
    if(appStorage.getItem(PINNED_BACKUP_KEY)!==serializedBackup)warnings.push('تعذر تثبيت قائمة العمال الاحتياطيين');
  }catch(error){
    warnings.push('تعذر تثبيت قائمة العمال الاحتياطيين');
    console.error('pinMainTable backup update failed:',error);
  }
  const message=warnings.length
    ?`تم تثبيت القائمة الرئيسية بنجاح وستظهر عند بدء يوم جديد؛ ${warnings.join('، ')}.`
    :'تم تثبيت القائمة الرئيسية بنجاح والتحقق من حفظها؛ ستظهر عند بدء يوم جديد.';
  setStatus(message);
  clearTimeout(window.statusTimer);
  window.statusTimer=setTimeout(()=>{const status=document.querySelector('#status');if(status)status.textContent=''},7000);
}
function setStatus(text){document.querySelector('#status').textContent=text;clearTimeout(window.statusTimer);window.statusTimer=setTimeout(()=>document.querySelector('#status').textContent='',3500)}

function normalizeRates(saved=[]){return Array.from({length:6},(_,r)=>{const row=saved[r];if(Array.isArray(row))return [row[0]||'',row[1]||'',r===5&&row[2]==='m'?'m':''];return [row||'','',''] })}
function autoEquipmentValue(result){
  const raw=[0,1,2,3,4].map(i=>String(result[i][0]??'').trim());
  if(!raw.every(value=>value!==''))return '';
  const [incoming,...deductions]=raw.map(value=>Number(value.replace(',','.')));
  return [incoming,...deductions].every(Number.isFinite)?String(Math.round((incoming-deductions.reduce((sum,value)=>sum+value,0))*100000)/100000):'';

function calculateEquipmentRates(rates){
  const result=normalizeRates(rates);
  if(result[5][2]==='m'&&String(result[5][0]).trim()!=='')return result; // رقم معدّل يدويًا
  result[5][0]=autoEquipmentValue(result);
  result[5][2]='';
  return result;
}

function evaluateCalculatorExpression(expression){
  const source=String(expression||'').replace(/\s+/g,'');
  if(!source)return NaN;
  const tokens=source.match(/(?:\d+(?:\.\d*)?|\.\d+)|[()+\-*/]/g)||[];
  if(tokens.join('')!==source)throw Error('invalid expression');
  let position=0;
  function factor(){const token=tokens[position++];if(token==='+')return factor();if(token==='-')return -factor();if(token==='('){const value=expressionValue();if(tokens[position++]!==')')throw Error('missing )');return value}if(token===undefined||!/^\d|^\./.test(token))throw Error('expected number');return Number(token)}
  function term(){let value=factor();while(tokens[position]==='*'||tokens[position]==='/'){const op=tokens[position++],right=factor();value=op==='*'?value*right:value/right}return value}
  function expressionValue(){let value=term();while(tokens[position]==='+'||tokens[position]==='-'){const op=tokens[position++],right=term();value=op==='+'?value+right:value-right}return value}
  const result=expressionValue();if(position!==tokens.length)throw Error('unexpected token');return result;
}

async function bootstrap(){
  // إن وُجدت بيانات محفوظة على الجهاز نعرضها فورًا ونزامن مع السحابة في الخلفية بدل انتظار الشبكة
  const cached=!SYNC_ENABLED||localHasData(),baseBefore=getBase();
  const syncing=(async()=>{try{await syncOnStart()}catch(e){console.warn('sync start failed',e)}})();
  if(!cached)await syncing;
  startApp();
  if(SYNC_ENABLED){
    setInterval(pollRemote,POLL_MS);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSharedState();else pollRemote()});
    window.addEventListener('pagehide',()=>{flushSharedState()});
  }
  if(cached){
    await syncing;
    if(getBase()!==baseBefore){try{prepareDay();rerenderFromStorage();updateAdminUi()}catch(e){console.warn(e)}}
  }
  try{const notice=sessionStorage.getItem('labor_notice');if(notice){sessionStorage.removeItem('labor_notice');setStatus(notice)}}catch{}
  if(SYNC_ENABLED&&isShiftAdmin()&&isDirty())scheduleRemoteSave(600);
}
bootstrap();
</script>
</body>
</html>
