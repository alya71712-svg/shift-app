<style>

ft)}.permit-section h3{margin:0 0 10px;font-size:17px;color:var(--accent)}.permit-section .entry-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.permit-select{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;outline:0}.permit-select:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}.permit-date{display:block;margin-top:4px;color:var(--accent);font-size:11px;font-weight:800;white-space:nowrap}.permit-type-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.permit-type-button{min-height:78px;font-size:17px;display:flex;align-items:center;justify-content:center;text-align:center}.permit-worker-list{display:grid;gap:8px}.permit-worker-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--cell);font-weight:700}.permit-worker-name{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--cell);font-weight:800;color:var(--ink)}.permit-archive-grid{display:grid;gap:9px}.permit-archive-worker{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--cell)}.permit-archive-worker strong{display:block;color:var(--ink);margin-bottom:7px}.permit-edit-label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.permit-archive-date-input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;direction:ltr;text-align:left}.permit-archive-date-input:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}.permit-archive-dates{margin-top:5px;color:var(--accent);font-size:13px;line-height:1.7}.permit-type-button.archive{background:var(--soft);color:var(--accent);border:1px solid var(--line)}.completed-entry{position:relative;background:#dcfce7!important;color:#166534!important}.completed-entry::after{content:"★";position:absolute;top:5px;left:7px;color:#d97706;font-size:22px;line-height:1}
body.panel-hidden .layout{grid-template-columns:1fr}body.panel-hidden .control-panel{display:none}body.panel-hidden .panel-toggle{position:fixed;right:0;top:50%;transform:translateY(-50%);border-radius:11px 0 0 11px;z-index:10}
@media(max-width:760px){body{padding:8px}.topbar{padding:16px;align-items:flex-start}.date-box{text-align:right}.layout{padding:13px;display:block}.control-panel{position:static;margin-top:18px}.panel-toggle{right:12px;top:12px;transform:none;border-radius:11px}.brand-mark{width:38px;height:38px}.today{font-size:15px}.name-action-menu{max-width:calc(100vw - 16px)}.name-action-menu .permit-submenu{right:auto;left:0;top:100%;min-width:175px;width:min(210px,calc(100vw - 32px));max-width:calc(100vw - 32px);box-sizing:border-box}.name-action-menu .permit-submenu button{white-space:normal;line-height:1.35;padding:9px 10px}}

<body>
<div class="app">
  <div class="paper">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">▤</div><div><h1>جدول توزيع العمالة</h1><p class="subtitle">لوحة يومية بواجهة هادئة مثل القارئ الإلكتروني</p></div></div>
      <div class="date-box"><span class="date-label">تاريخ اليوم</span><span class="today" id="today"></span></div><div class="font-control"><button class="font-button" onclick="toggleFontMenu()" title="التحكم في حجم الخط">A</button><div class="font-menu" id="fontMenu"><span class="font-menu-title">حجم خط الجدول</span><div class="font-actions"><button onclick="changeFontSize(-1)">−</button><span class="font-value" id="fontValue">19</span><button onclick="changeFontSize(1)">+</button></div></div></div>
    </header>
    <main class="layout">
      <section class="workspace">
        <div class="section-title"><h2>بيانات اليوم</h2><span class="hint">اكتب مباشرة داخل الخانات</span></div>
        <div class="table-wrap"><table id="workTable"><tbody></tbody></table></div>
        <div class="actions"><button onclick="saveToday()">حفظ بيانات اليوم</button><button class="ghost" onclick="pinMainTable()" title="يحفظ الأسماء الحالية لتظهر تلقائيًا في بداية كل يوم">تثبيت القائمة الرئيسية</button><button class="secondary" onclick="clearTable()">مسح الجدول</button><span class="status" id="status"></span></div>
      </section>
      <aside class="control-panel" id="controlPanel">
        <div class="panel-heading"><h3>لوحة التحكم</h3><span>☰</span></div>
        <div class="nav-grid">
          <button class="nav-btn" onclick="openStaff('backup')"><span class="nav-icon">◈</span>العمال الاحتياطي</button><button class="nav-btn" onclick="openPermits()"><span class="nav-icon">⌑</span>تصاريح</button>
          <button class="nav-btn" onclick="openStaff('leave')"><span class="nav-icon">◌</span>الإجازات اليوم</button>
          <button class="nav-btn" onclick="openAnnualLeave()"><span class="nav-icon">▣</span>الإجازة السنوية</button>
          <button class="nav-btn" onclick="openArchive()"><span class="nav-icon">▦</span>الأرشيف</button>
          <button class="nav-btn" onclick="openRates()"><span class="nav-icon">⌁</span>معدلات</button>
          <button class="nav-btn" onclick="openThemes()"><span class="nav-icon">◐</span>السيمات</button>
          <button class="nav-btn" onclick="toggleFontMenu()"><span class="nav-icon">A</span>حجم الخط</button><button class="nav-btn" onclick="exportBackup()"><span class="nav-icon">⬇</span>تصدير نسخة</button><button class="nav-btn" onclick="document.querySelector('#backupFileInput').click()"><span class="nav-icon">⬆</span>استيراد نسخة</button>
        </div>
      </aside>
    </main>
  </div>
  <button class="panel-toggle" id="togglePanel" type="button" onclick="togglePanel(event)" title="إظهار أو إخفاء لوحة التحكم" aria-label="إظهار أو إخفاء لوحة التحكم">☰</button>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="backdropClose(event)"><div class="modal" id="modal"></div></div><input type="file" id="backupFileInput" accept="application/json,.json" hidden onchange="importBackup(event)">
<script>
const ROWS=10,COLS=9,TABLE_KEY='labor_distribution_table_v2',PINNED_TABLE_KEY='labor_pinned_table',BASE_TABLE_KEY='labor_base_table',BASE_LOCK_KEY='labor_base_locked_v2',APP_DAY_KEY='labor_app_day',BACKUP_KEY='labor_backup',PINNED_BACKUP_KEY='labor_pinned_backup',LEAVE_KEY='labor_leave',ARCHIVE_KEY='labor_archive',COMPLETED_KEY='labor_completed_cells',THEME_KEY='labor_theme',ANNUAL_LEAVE_KEY='labor_annual_leave',PERMITS_KEY='labor_permits',MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const tbody=document.querySelector('#workTable tbody'), todayEl=document.querySelector('#today'), modalBackdrop=document.querySelector('#modalBackdrop'), modal=document.querySelector('#modal');
let currentDateKey=getDateKey();
const themes={
 blue:{name:'أزرق هادئ',bg:'#eef2f5',paper:'#fff',ink:'#1e293b',accent:'#2563eb',accent2:'#1d4ed8',line:'#cbd5e1',soft:'#eff6ff'},
 green:{name:'نعناع',bg:'#eef7f1',paper:'#fff',ink:'#16352a',accent:'#16805b',accent2:'#106344',line:'#b9d8c7',soft:'#e7f6ed'},
 sand:{name:'ورق دافئ',bg:'#f7f1e7',paper:'#fffdf8',ink:'#463728',accent:'#a76b25',accent2:'#824d16',line:'#ddc8a8',soft:'#fff4df'},
 purple:{name:'لافندر',bg:'#f3f0fa',paper:'#fff',ink:'#30264b',accent:'#7c4dba',accent2:'#5e3294',line:'#d5c7e9',soft:'#f2eafd'},
 rose:{name:'وردي ناعم',bg:'#fbf0f2',paper:'#fff',ink:'#4b2630',accent:'#c94b6b',accent2:'#a53251',line:'#ebc4cf',soft:'#fff0f4'},
 teal:{name:'بحري',bg:'#eaf5f6',paper:'#fff',ink:'#16383c',accent:'#087f8c',accent2:'#06636e',line:'#b8dfe1',soft:'#e1f5f7'},
 graphite:{name:'رمادي أنيق',bg:'#e9ecef',paper:'#fff',ink:'#20252b',accent:'#495057',accent2:'#343a40',line:'#c6cbd0',soft:'#edf0f2'},
 orange:{name:'مشمشي',bg:'#fff3eb',paper:'#fff',ink:'#492a1c',accent:'#e06d2d',accent2:'#bd4e17',line:'#f1c8b1',soft:'#fff0e6'},
 navy:{name:'كحلي',bg:'#e9eef7',paper:'#f8fafc',ink:'#16243b',accent:'#315b9d',accent2:'#20447d',line:'#bcc9df',soft:'#e8effb'},
 dark:{name:'ليلي',bg:'#111827',paper:'#1f2937',ink:'#f1f5f9',accent:'#60a5fa',accent2:'#3b82f6',line:'#475569',soft:'#263449'}
};
function getDateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatDate(d=new Date()){return d.toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
function distinguishHisham(data=[]){let found=0;return data.map(row=>row.map((cell,c)=>{const value=String(cell||'').trim();if(c>0&&value==='هشام'){found++;return found===2?'هشام ب':value}return cell}))}
function distinguishHassan(data=[]){let found=0,marked=false;const rows=data.map(row=>row.map((cell,c)=>{const value=String(cell||'').trim();if(c>0&&value==='حسن'&&String(row[0]||'').includes('رشم')){marked=true;return 'حسن ط'}return cell}));return rows.map(row=>row.map((cell,c)=>{if(c>0&&String(cell||'').trim()==='حسن'){found++;return !marked&&found===2?'حسن ط':cell}return cell}))}
function ensureHishamDistinction(){const base=JSON.parse(localStorage.getItem(BASE_TABLE_KEY)||'[]');const fixedBase=distinguishHassan(distinguishHisham(base));if(JSON.stringify(base)!==JSON.stringify(fixedBase))localStorage.setItem(BASE_TABLE_KEY,JSON.stringify(fixedBase));const current=JSON.parse(localStorage.getItem(PINNED_TABLE_KEY)||localStorage.getItem(TABLE_KEY)||'[]');const fixedCurrent=distinguishHassan(distinguishHisham(current));if(JSON.stringify(current)!==JSON.stringify(fixedCurrent)){localStorage.setItem(PINNED_TABLE_KEY,JSON.stringify(fixedCurrent));localStorage.setItem(TABLE_KEY,JSON.stringify(fixedCurrent));}}
function withBlowSection(data=[]){
  const rows=Array.isArray(data)?data.map(row=>Array.isArray(row)?row.slice(0,COLS):[]):[];
  const blowIndex=rows.findIndex(row=>String(row[0]||'').trim()==='بلوف');
  if(blowIndex===-1){
    const farzIndex=rows.findIndex(row=>String(row[0]||'').trim()==='فرز');
    const blowRow=['بلوف',...Array(COLS-1).fill('')];
    rows.splice(farzIndex===-1?rows.length:farzIndex+1,0,blowRow);
  }else{
    rows[blowIndex][0]='بلوف';
    for(let c=1;c<COLS;c++)rows[blowIndex][c]=rows[blowIndex][c]||'';
  }
  while(rows.length<ROWS)rows.push([]);
  return rows.slice(0,ROWS);
}
function ensureBlowSectionInStorage(){
  [BASE_TABLE_KEY,PINNED_TABLE_KEY,TABLE_KEY].forEach(key=>{
    const raw=localStorage.getItem(key);
    if(raw)localStorage.setItem(key,JSON.stringify(withBlowSection(JSON.parse(raw))));
  });

function removeNamesFromRoster(names){

function evaluateCalculatorExpression(expression){

  function expressionValue(){let value=term();while(tokens[position]==='+'||tokens[position]==='-'){const op=tokens[position++],right=term();value=op==='+'?value+right:value-right}return value}
  const result=expressionValue();if(position!==tokens.length)throw Error('unexpected token');return result;
}

function changeFontSize(delta){const current=Number(localStorage.getItem('labor_font_size')||19);const next=Math.max(14,Math.min(30,current+delta));document.documentElement.style.setProperty('--cell-font-size',next+'px');document.querySelector('#fontValue').textContent=next;localStorage.setItem('labor_font_size',String(next))}

function init(){todayEl.textContent=formatDate();prepareDay();applySavedFontSize();const hidden=localStorage.getItem('panel_hidden')==='1';document.body.classList.toggle('panel-hidden',hidden);const panel=document.querySelector('#controlPanel');if(panel)panel.setAttribute('aria-hidden',hidden?'true':'false');const button=document.querySelector('#togglePanel');if(button){button.textContent=hidden?'☰':'×';button.title=hidden?'إظهار لوحة التحكم':'إخفاء لوحة التحكم'}if(!localStorage.getItem(PINNED_BACKUP_KEY)&&localStorage.getItem(BACKUP_KEY))localStorage.setItem(PINNED_BACKUP_KEY,localStorage.getItem(BACKUP_KEY));applyTheme(localStorage.getItem(THEME_KEY)||'blue');createTable();saveToday(true)}
init();
</script>
</body>
</html>
