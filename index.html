<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>توزيع العمالة | لوحة العمل</title>
<style>
:root{--cell-font-size:19px;--bg:#eef2f5;--paper:#fff;--ink:#1e293b;--muted:#64748b;--accent:#2563eb;--accent2:#1d4ed8;--line:#cbd5e1;--cell:#fff;--soft:#eff6ff;--shadow:0 14px 40px rgba(15,23,42,.10)}
*{box-sizing:border-box} body{margin:0;min-height:100vh;padding:18px;background:var(--bg);color:var(--ink);font-family:"Tajawal",Tahoma,Arial,sans-serif;transition:background .25s,color .25s}

.shift-selector{display:flex;justify-content:center;gap:12px;padding:12px 24px;background:color-mix(in srgb,var(--paper) 60%,var(--soft));border-bottom:1px solid var(--line)}

.shift-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.layout{display:grid;grid-template-columns:1fr 250px;gap:20px;padding:22px}.workspace{min-width:0}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}.section-title h2{margin:0;font-size:20px}.hint{font-size:12px;color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--cell)}table{width:100%;min-width:760px;border-collapse:collapse;table-layout:fixed}td{border:1px solid var(--line);height:72px;padding:9px;vertical-align:top;background:var(--cell);font-size:var(--cell-font-size);line-height:1.45;transition:background .15s}#workTable td:first-child{background:var(--accent);color:#fff;font-weight:800;border-left:2px solid var(--accent2)}#workTable td:first-child:focus{background:#c5eccc}td:focus{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:-3px;background:var(--soft)}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}button{border:0;border-radius:11px;padding:10px 15px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;transition:transform .15s,filter .15s,background .15s}button:hover{filter:brightness(1.06);transform:translateY(-1px)}button.secondary{background:color-mix(in srgb,var(--muted) 85%,#000)}button.ghost{background:var(--soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 20%,var(--line))}
.control-panel{border:1px solid var(--line);border-radius:18px;padding:14px;background:color-mix(in srgb,var(--paper) 88%,var(--soft));height:max-content;position:sticky;top:12px}.panel-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.panel-heading h3{margin:0;font-size:16px}.panel-toggle{position:absolute;top:11px;right:-1px;transform:translateX(100%);width:38px;height:38px;padding:0;border-radius:0 11px 11px 0;display:grid;place-items:center;background:var(--accent);font-size:18px}.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.nav-btn{width:100%;display:flex;align-items:center;gap:10px;justify-content:flex-start;margin:7px 0;background:transparent;color:var(--ink);border:1px solid var(--line)}.nav-btn:hover,.nav-btn.active{background:var(--soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}.nav-btn b{margin-right:auto;font-size:11px}.rates-table{min-width:520px;max-width:760px;margin:auto}.rates-table col.rate-name-col{width:28%}.rates-table col.rate-value-col{width:36%}.rates-table th{border:1px solid var(--line);padding:9px;background:var(--accent);color:#fff;font-size:15px}.rates-table td.rate-name{width:28%;font-size:14px}.rates-table td.rate-value{width:36%;text-align:center;vertical-align:middle}.rates-table td{height:48px;font-size:16px;vertical-align:middle}.rates-table td:first-child{background:var(--accent);color:#fff;font-weight:800;text-align:right}.rates-table td[contenteditable="true"]{background:var(--cell)}.rates-table td[contenteditable="true"]:focus{background:var(--soft)}.rates-table .incoming-cell{cursor:pointer;background:var(--soft);font-weight:800}.rates-table .derived-rate{cursor:default;background:var(--soft);color:var(--accent2);font-weight:900}.rates-table .incoming-cell:hover{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:-3px}.calculator{max-width:380px;margin:auto}.calc-display{width:100%;height:58px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;direction:ltr;font-size:26px;font-weight:800;background:var(--soft);color:var(--ink);margin-bottom:12px}.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calc-grid button{min-height:48px;font-size:18px}.calc-grid button.calc-op{background:var(--accent2)}.calc-grid button.calc-clear{background:#b91c1c}.calc-total{margin:14px 0 0;padding:12px;border-radius:11px;background:var(--soft);font-weight:800;text-align:center}.completed-cell{position:relative;background:var(--soft)!important;color:var(--accent2)!important;white-space:nowrap}.completed-cell::after{content:"★";display:block;position:static;color:var(--accent)!important;font-size:22px;line-height:1;margin-top:3px}.completed-cell[contenteditable="true"]{padding-left:9px}.rates-note{font-size:12px;color:var(--muted);margin:0 0 12px}.nav-icon{font-size:18px;width:24px;text-align:center}.panel-note{font-size:12px;line-height:1.7;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-backdrop.open{display:flex}.modal{width:min(900px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:20px;box-shadow:0 25px 70px rgba(0,0,0,.25);padding:22px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.modal-head h2{margin:0;font-size:22px}.close{background:transparent;color:var(--muted);font-size:24px;padding:3px 10px}.entry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.entry{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:8px;background:var(--cell)}.entry span{color:var(--muted);font-size:12px;min-width:23px}.entry input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:inherit}.modal-footer{margin-top:16px;display:flex;justify-content:flex-start;gap:9px}.archive-months{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:9px}.month-card{padding:13px 9px;background:var(--soft);color:var(--ink);border:1px solid var(--line);text-align:center}.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:8px;margin-top:13px}.day-card{background:var(--cell);color:var(--ink);border:1px solid var(--line);text-align:center}.day-card.saved{border-color:var(--accent);color:var(--accent)}.annual-list{display:grid;gap:9px}.annual-worker{border:1px solid var(--line);border-radius:12px;background:var(--cell);overflow:hidden}.annual-worker summary{cursor:pointer;padding:12px 14px;font-weight:800;display:flex;align-items:center;justify-content:space-between;list-style:none}.annual-worker summary::-webkit-details-marker{display:none}.annual-worker summary:after{content:'⌄';color:var(--accent);font-size:18px}.annual-worker[open] summary{background:var(--soft);color:var(--accent)}.annual-worker .annual-detail{padding:10px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}.annual-worker select{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font:inherit}.annual-count{font-size:12px;color:var(--muted);font-weight:400}.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.theme-card{border:2px solid var(--line);background:var(--cell);color:var(--ink);padding:12px;border-radius:14px;text-align:right}.theme-card.selected{border-color:var(--accent)}.swatches{display:flex;gap:5px;margin-bottom:9px}.swatches i{height:28px;flex:1;border-radius:6px}.status{min-height:20px;margin-top:10px;font-size:13px;color:var(--accent)}.name-action-menu{position:fixed;z-index:40;min-width:185px;padding:6px;background:var(--soft)!important;color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;box-shadow:0 15px 35px rgba(15,23,42,.2)}.name-action-menu button{display:block;width:100%;margin:2px 0;text-align:right;background:var(--soft)!important;color:var(--ink);border-radius:8px}.name-action-menu button:hover{background:var(--soft)!important;color:var(--accent)}.name-action-menu button.action-leave:hover{color:#b91c1c}.permit-menu{position:relative}.permit-menu>a{display:flex;align-items:center;justify-content:space-between}.permit-submenu{display:none;position:absolute;right:100%;top:-5px;min-width:175px;padding:6px;background:var(--soft)!important;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:12px;box-shadow:var(--shadow)}.permit-menu:hover .permit-submenu,.permit-menu:focus-within .permit-submenu{display:block}.permit-submenu button{margin:2px 0}.permit-grid{display:grid;gap:12px}.permit-section{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--soft)}.permit-section h3{margin:0 0 10px;font-size:17px;color:var(--accent)}.permit-section .entry-grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.permit-select{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;outline:0}.permit-select:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 20%,transparent)}.permit-date{display:block;margin-top:4px;color:var(--accent);font-size:11px;font-weight:800;white-space:nowrap}.permit-type-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}.permit-type-button{min-height:78px;font-size:17px;display:flex;align-items:center;justify-content:center;text-align:center}.permit-worker-list{display:grid;gap:8px}.permit-worker-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--cell);font-weight:700}.permit-worker-name{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--cell);font-weight:800;color:var(--ink)}.permit-archive-grid{display:grid;gap:9px}.permit-archive-worker{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--cell)}.permit-archive-worker strong{display:block;color:var(--ink);margin-bottom:7px}.permit-edit-label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.permit-archive-date-input{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;direction:ltr;text-align:left}.permit-archive-date-input:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}.permit-archive-dates{margin-top:5px;color:var(--accent);font-size:13px;line-height:1.7}.permit-type-button.archive{background:var(--soft);color:var(--accent);border:1px solid var(--line)}.completed-entry{position:relative;background:#dcfce7!important;color:#166534!important}.completed-entry::after{content:"★";position:absolute;top:5px;left:7px;color:#d97706;font-size:22px;line-height:1}
body.panel-hidden .layout{grid-template-columns:1fr}body.panel-hidden .control-panel{display:none}body.panel-hidden .panel-toggle{position:fixed;right:0;top:50%;transform:translateY(-50%);border-radius:11px 0 0 11px;z-index:10}
@media(max-width:760px){body{padding:8px}.topbar{padding:16px;align-items:flex-start}.date-box{text-align:right}.layout{padding:13px;display:block}.control-panel{position:static;margin-top:18px}.panel-toggle{right:12px;top:12px;transform:none;border-radius:11px}.brand-mark{width:38px;height:38px}.today{font-size:15px}.name-action-menu{max-width:calc(100vw - 16px)}.name-action-menu .permit-submenu{right:auto;left:0;top:100%;min-width:175px;width:min(210px,calc(100vw - 32px));max-width:calc(100vw - 32px);box-sizing:border-box}.name-action-menu .permit-submenu button{white-space:normal;line-height:1.35;padding:9px 10px}}

<body>
<div class="app">
  <div class="paper">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">▤</div><div><h1>جدول توزيع العمالة</h1><p class="subtitle">لوحة يومية بواجهة هادئة مثل القارئ الإلكتروني</p></div></div>
      <div class="date-box"><span class="date-label">تاريخ اليوم</span><span class="today" id="today"></span></div><div class="font-control"><button class="font-button" onclick="toggleFontMenu()" title="التحكم في حجم الخط">A</button><div class="font-menu" id="fontMenu"><span class="font-menu-title">حجم خط الجدول</span><div class="font-actions"><button onclick="changeFontSize(-1)">−</button><span class="font-value" id="fontValue">19</span><button onclick="changeFontSize(1)">+</button></div></div></div>
    </header>
    
    <!-- اختيار الوردية -->
    <div class="shift-selector">
      <button class="shift-btn active" id="btnShiftA" onclick="switchShift('A')">الوردية (أ)</button>
      <button class="shift-btn" id="btnShiftB" onclick="switchShift('B')">الوردية (ب)</button>
    </div>

    <main class="layout">
      <section class="workspace">
        <div class="section-title"><h2 id="workspaceTitle">بيانات اليوم - الوردية (أ)</h2><span class="hint">اكتب مباشرة داخل الخانات</span></div>
        <div class="table-wrap"><table id="workTable"><tbody></tbody></table></div>
        <div class="actions"><button onclick="saveToday()">حفظ بيانات اليوم</button><button class="ghost" onclick="pinMainTable()" title="يحفظ الأسماء الحالية لتظهر تلقائيًا في بداية كل يوم">تثبيت القائمة الرئيسية</button><button class="secondary" onclick="clearTable()">مسح الجدول</button><span class="status" id="status"></span></div>
      </section>
      <aside class="control-panel" id="controlPanel">
        <div class="panel-heading"><h3>لوحة التحكم</h3><span>☰</span></div>
        <div class="nav-grid">
          <button class="nav-btn" onclick="openStaff('backup')"><span class="nav-icon">◈</span>العمال الاحتياطي</button><button class="nav-btn" onclick="openPermits()"><span class="nav-icon">⌑</span>تصاريح</button>
          <button class="nav-btn" onclick="openStaff('leave')"><span class="nav-icon">◌</span>الإجازات اليوم</button>
          <button class="nav-btn" onclick="openAnnualLeave()"><span class="nav-icon">▣</span>الإجازة السنوية</button>
          <button class="nav-btn" onclick="openArchive()"><span class="nav-icon">▦</span>الأرشيف</button>
          <button class="nav-btn" onclick="openRates()"><span class="nav-icon">⌁</span>معدلات</button>
          <button class="nav-btn" onclick="openThemes()"><span class="nav-icon">◐</span>السيمات</button>
          <button class="nav-btn" onclick="toggleFontMenu()"><span class="nav-icon">A</span>حجم الخط</button><button class="nav-btn" onclick="exportBackup()"><span class="nav-icon">⬇</span>تصدير نسخة</button><button class="nav-btn" onclick="document.querySelector('#backupFileInput').click()"><span class="nav-icon">⬆</span>استيراد نسخة</button>
        </div>
      </aside>
    </main>
  </div>
  <button class="panel-toggle" id="togglePanel" type="button" onclick="togglePanel(event)" title="إظهار أو إخفاء لوحة التحكم" aria-label="إظهار أو إخفاء لوحة التحكم">☰</button>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="backdropClose(event)"><div class="modal" id="modal"></div></div><input type="file" id="backupFileInput" accept="application/json,.json" hidden onchange="importBackup(event)">
<script>
let currentShift = localStorage.getItem('labor_current_shift') || 'A';

function getShiftPrefix() {
  return currentShift === 'B' ? 'shiftB_' : '';
}

const ROWS=10,COLS=9,MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function getKeys() {
  const p = getShiftPrefix();
  return {
    TABLE_KEY: p + 'labor_distribution_table_v2',
    PINNED_TABLE_KEY: p + 'labor_pinned_table',
    BASE_TABLE_KEY: p + 'labor_base_table',
    BASE_LOCK_KEY: p + 'labor_base_locked_v2',
    APP_DAY_KEY: p + 'labor_app_day',
    BACKUP_KEY: p + 'labor_backup',
    PINNED_BACKUP_KEY: p + 'labor_pinned_backup',
    LEAVE_KEY: p + 'labor_leave',
    ARCHIVE_KEY: p + 'labor_archive',
    COMPLETED_KEY: p + 'labor_completed_cells',
    ANNUAL_LEAVE_KEY: p + 'labor_annual_leave',
    PERMITS_KEY: p + 'labor_permits',
    RATES_KEY: p + 'labor_rates'
  };
}

const THEME_KEY='labor_theme';
const tbody=document.querySelector('#workTable tbody'), todayEl=document.querySelector('#today'), modalBackdrop=document.querySelector('#modalBackdrop'), modal=document.querySelector('#modal');
let currentDateKey=getDateKey();

const themes={
 blue:{name:'أزرق هادئ',bg:'#eef2f5',paper:'#fff',ink:'#1e293b',accent:'#2563eb',accent2:'#1d4ed8',line:'#cbd5e1',soft:'#eff6ff'},
 green:{name:'نعناع',bg:'#eef7f1',paper:'#fff',ink:'#16352a',accent:'#16805b',accent2:'#106344',line:'#b9d8c7',soft:'#e7f6ed'},
 sand:{name:'ورق دافئ',bg:'#f7f1e7',paper:'#fffdf8',ink:'#463728',accent:'#a76b25',accent2:'#824d16',line:'#ddc8a8',soft:'#fff4df'},
 purple:{name:'لافندر',bg:'#f3f0fa',paper:'#fff',ink:'#30264b',accent:'#7c4dba',accent2:'#5e3294',line:'#d5c7e9',soft:'#f2eafd'},
 rose:{name:'وردي ناعم',bg:'#fbf0f2',paper:'#fff',ink:'#4b2630',accent:'#c94b6b',accent2:'#a53251',line:'#ebc4cf',soft:'#fff0f4'},
 teal:{name:'بحري',bg:'#eaf5f6',paper:'#fff',ink:'#16383c',accent:'#087f8c',accent2:'#06636e',line:'#b8dfe1',soft:'#e1f5f7'},
 graphite:{name:'رمادي أنيق',bg:'#e9ecef',paper:'#fff',ink:'#20252b',accent:'#495057',accent2:'#343a40',line:'#c6cbd0',soft:'#edf0f2'},
 orange:{name:'مشمشي',bg:'#fff3eb',paper:'#fff',ink:'#492a1c',accent:'#e06d2d',accent2:'#bd4e17',line:'#f1c8b1',soft:'#fff0e6'},
 navy:{name:'كحلي',bg:'#e9eef7',paper:'#f8fafc',ink:'#16243b',accent:'#315b9d',accent2:'#20447d',line:'#bcc9df',soft:'#e8effb'}
